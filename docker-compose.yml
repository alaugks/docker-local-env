services:

  # MariaDB 10.11.19
  mariadb-10-11:
    image: mariadb:10.11.19@sha256:7d829180b5b2a9ba74f6242876ab401a0d7dd338a807e522ef92bc9698760f20
    container_name: mariadb-10-11
    ports:
      - "13308:3306"
    volumes:
      - mariadb-10-11:/var/lib/mysql
    networks:
      - local_network
    command: --max_allowed_packet=32505856
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root-password
      MARIADB_DATABASE: dev-database
      MARIADB_USER: dev-user
      MARIADB_PASSWORD: dev-password

  # MariaDB 10.9.8
  mariadb-10-9:
    image: mariadb:10.9.8@sha256:56710811b0b96233ef84f4982d3337d88d3aa46a68f3fcb2853b94e1d04ea25c
    container_name: mariadb-10-9
    ports:
      - "13306:3306"
    volumes:
      - mariadb-10-9:/var/lib/mysql
    networks:
      - local_network
    command: --max_allowed_packet=32505856
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root-password
      MARIADB_DATABASE: dev-database
      MARIADB_USER: dev-user
      MARIADB_PASSWORD: dev-password

  # MariaDB 10.6.28
  mariadb-10-6:
    image: mariadb:10.6.28@sha256:c7d726a1c0d29e486a1ab4ef0c76c75431a11428e76c50e99ba32106cea04114
    container_name: mariadb-10-6
    ports:
      - "13307:3306"
    volumes:
      - mariadb-10-6:/var/lib/mysql
    networks:
      - local_network
    command: --max_allowed_packet=32505856
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root-password
      MARIADB_DATABASE: dev-database
      MARIADB_USER: dev-user
      MARIADB_PASSWORD: dev-password

  # Redis 7.2.16
  redis-7-2:
    image: redis:7.2.17-alpine@sha256:2f66de68111e64c3927859f158f8e666066dae2b97d9f82770a6f37a5aa1c335
    container_name: redis-7-2
    ports:
      - "16379:6379"
    volumes:
      - redis-7-2:/data
    networks:
      - local_network
    restart: always

  # ValKey 8.1.10
  valkey-8-1:
    image: valkey/valkey:8.1.12-alpine@sha256:9971099af41c36e887aabdfe22b80c0fe45df949163dfc9cb434febc57cfc3fc
    container_name: valkey-8-1
    ports:
      - "26379:6379"
    volumes:
      - valkey-8-1:/data
    networks:
      - local_network
    restart: always

  # PHP 8.4.26-fpm
  php-fpm-cf:
    build:
      context: .
      dockerfile: Dockerfile.php-fpm-cf
    container_name: php-fpm-cf
    ports:
      - "10000:9000"
    networks:
      - local_network
    restart: always

  # S3Mock 5.1.0
  s3mock:
    image: adobe/s3mock:5.1.0@sha256:65cf60155a2e235fe7d5bf6c633747d6fc7ed93f9f5a6727d86470026b83c2a2
    container_name: s3mock
    ports:
      - "9092:9090"
    volumes:
      - s3mock:/data
    networks:
      - local_network
    restart: always
    environment:
      - initialBuckets=test-bucket

  # min.io RELEASE.2025-10-15T17-29-55Z (built from source)
  minio:
    build:
      context: .
      dockerfile: Dockerfile.minio
      args:
        RELEASE: RELEASE.2025-10-15T17-29-55Z
    image: local/minio:RELEASE.2025-10-15T17-29-55Z
    container_name: minio
    ports:
      - "9004:9000"
      - "9005:9001"
    volumes:
      - minio:/data
    networks:
      - local_network
    restart: always
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: dev-password
    command: server /data --console-address ":9001"

  createbuckets:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set minio http://minio:9000 minio dev-password;
      /usr/bin/mc mb minio/testS3bucket;
      /usr/bin/mc policy set public minio/testS3bucket;
      exit 0;
      "

  # MongoDB 7.0.43
  mongo-7-0:
    image: mongo:7.0.48@sha256:884c055bff8b7144ca44830d01826facd3083b33c4dea44b94a1476c62de3c32
    container_name: mongo-7-0
    ports:
      - "27017:27017"
    volumes:
      - mongo-7-0:/data
    networks:
      - local_network
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root-dev-password

  # Node.js 24.22.0 LTS (Krypton) with npm
  # Interpreter container for (JetBrains) IDEs (Settings > Node.js > Docker Compose),
  # no ports, only kept alive so the IDE can run node/npm inside it.
  node-24:
    image: node:24.22.3-alpine@sha256:116b800c3754b440ee0aa3ed2f20f5bf3d99a554bfd9adeea09ea8017f6e85f5
    container_name: node-24
    volumes:
      - node-24-npm-cache:/home/node/.npm
    networks:
      - local_network
    command: tail -f /dev/null
    restart: always

volumes:
  mariadb-10-11:
    name: mariadb-10-11
  mariadb-10-6:
    name: mariadb-10-6
  mariadb-10-9:
    name: mariadb-10-9
  redis-7-2:
    name: redis-7-2
  valkey-8-1:
    name: valkey-8-1
  s3mock:
    name: s3mock
  minio:
    name: minio
  mongo-7-0:
    name: mongo-7-0
  mock-saml:
    name: mock-saml
  node-24-npm-cache:
    name: node-24-npm-cache

networks:
  local_network:
    name: local_network
#    external: true
