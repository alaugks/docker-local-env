services:

  # MariaDB 10.11.19
  mariadb-10-11:
    image: mariadb:10.11.19@sha256:0d0945c57f75b3a3b9ebe71aedaaad005fa5305054e8fca3d2e42a8c92b43b5e
    container_name: mariadb-10-11
    ports:
      - "13308:3306"
    volumes:
      - mariadb-10-11:/var/lib/mysql
    networks:
      - local_network
    command: --max_allowed_packet=32505856
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root-password
      MARIADB_DATABASE: dev-database
      MARIADB_USER: dev-user
      MARIADB_PASSWORD: dev-password

  # MariaDB 10.9.8
  mariadb-10-9:
    image: mariadb:10.9.8@sha256:56710811b0b96233ef84f4982d3337d88d3aa46a68f3fcb2853b94e1d04ea25c
    container_name: mariadb-10-9
    ports:
      - "13306:3306"
    volumes:
      - mariadb-10-9:/var/lib/mysql
    networks:
      - local_network
    command: --max_allowed_packet=32505856
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root-password
      MARIADB_DATABASE: dev-database
      MARIADB_USER: dev-user
      MARIADB_PASSWORD: dev-password

  # MariaDB 10.6.28
  mariadb-10-6:
    image: mariadb:10.6.28@sha256:88ac718dafee1e8fb415233c04f314f3c3866af99177ce25d436106c62090461
    container_name: mariadb-10-6
    ports:
      - "13307:3306"
    volumes:
      - mariadb-10-6:/var/lib/mysql
    networks:
      - local_network
    command: --max_allowed_packet=32505856
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root-password
      MARIADB_DATABASE: dev-database
      MARIADB_USER: dev-user
      MARIADB_PASSWORD: dev-password

  # Redis 7.2.16
  redis-7-2:
    image: redis:7.2.16-alpine@sha256:ee061d86c25773048211e99f00d63b47b9ecfe28560113e16cce2c962d5bec1c
    container_name: redis-7-2
    ports:
      - "16379:6379"
    volumes:
      - redis-7-2:/data
    networks:
      - local_network
    restart: always

  # ValKey 8.1.10
  valkey-8-1:
    image: valkey/valkey:8.1.10-alpine@sha256:081c2f5cb575efc901aa80ff9cdbd1ec6a301682fd35e1ebb4b0990a4a4a8507
    container_name: valkey-8-1
    ports:
      - "26379:6379"
    volumes:
      - valkey-8-1:/data
    networks:
      - local_network
    restart: always

  # PHP 8.4.26-fpm
  php-fpm-cf:
    build:
      context: .
      dockerfile: Dockerfile.php-fpm-cf
    container_name: php-fpm-cf
    ports:
      - "10000:9000"
    networks:
      - local_network
    restart: always

  # S3Mock 5.1.0
  s3mock:
    image: adobe/s3mock:5.1.0@sha256:65cf60155a2e235fe7d5bf6c633747d6fc7ed93f9f5a6727d86470026b83c2a2
    container_name: s3mock
    ports:
      - "9092:9090"
    volumes:
      - s3mock:/data
    networks:
      - local_network
    restart: always
    environment:
      - initialBuckets=test-bucket

  # min.io RELEASE.2025-10-15T17-29-55Z (built from source)
  minio:
    build:
      context: .
      dockerfile: Dockerfile.minio
      args:
        RELEASE: RELEASE.2025-10-15T17-29-55Z
    image: local/minio:RELEASE.2025-10-15T17-29-55Z
    container_name: minio
    ports:
      - "9004:9000"
      - "9005:9001"
    volumes:
      - minio:/data
    networks:
      - local_network
    restart: always
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: dev-password
    command: server /data --console-address ":9001"

  createbuckets:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set minio http://minio:9000 minio dev-password;
      /usr/bin/mc mb minio/testS3bucket;
      /usr/bin/mc policy set public minio/testS3bucket;
      exit 0;
      "

  # MongoDB 7.0.43
  mongo-7-0:
    image: mongo:7.0.45@sha256:c53852c00c23ca9f23fc39690350ffa9a80e3642fe8f96879726d8da0abe80a7
    container_name: mongo-7-0
    ports:
      - "27017:27017"
    volumes:
      - mongo-7-0:/data
    networks:
      - local_network
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root-dev-password

  # Node.js 24.22.0 LTS (Krypton) with npm
  # Interpreter container for (JetBrains) IDEs (Settings > Node.js > Docker Compose),
  # no ports, only kept alive so the IDE can run node/npm inside it.
  node-24:
    image: node:24.22.0-alpine@sha256:44fce696f38ba8c987c4db89954051000bbd05ffd8d8659ba15ed4a8602e937f
    container_name: node-24
    volumes:
      - node-24-npm-cache:/home/node/.npm
    networks:
      - local_network
    command: tail -f /dev/null
    restart: always

volumes:
  mariadb-10-11:
    name: mariadb-10-11
  mariadb-10-6:
    name: mariadb-10-6
  mariadb-10-9:
    name: mariadb-10-9
  redis-7-2:
    name: redis-7-2
  valkey-8-1:
    name: valkey-8-1
  s3mock:
    name: s3mock
  minio:
    name: minio
  mongo-7-0:
    name: mongo-7-0
  mock-saml:
    name: mock-saml
  node-24-npm-cache:
    name: node-24-npm-cache

networks:
  local_network:
    name: local_network
#    external: true
