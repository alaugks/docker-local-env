services:

  # MariaDB 10.11.11
  mariadb-10-11:
    image: mariadb:10.11.11
    container_name: mariadb-10-11
    ports:
      - "13308:3306"
    volumes:
      - mariadb-10-11:/var/lib/mysql
    networks:
      - local_network
    command: --max_allowed_packet=32505856
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root-password
      MARIADB_DATABASE: dev-database
      MARIADB_USER: dev-user
      MARIADB_PASSWORD: dev-password

  # MariaDB 10.9.3
  mariadb-10-9:
    image: mariadb:10.9.3
    container_name: mariadb-10-9
    ports:
      - "13306:3306"
    volumes:
      - mariadb-10-9:/var/lib/mysql
    networks:
      - local_network
    command: --max_allowed_packet=32505856
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root-password
      MARIADB_DATABASE: dev-database
      MARIADB_USER: dev-user
      MARIADB_PASSWORD: dev-password

  # MariaDB 10.6.16
  mariadb-10-6:
    image: mariadb:10.6.16
    container_name: mariadb-10-6
    ports:
      - "13307:3306"
    volumes:
      - mariadb-10-6:/var/lib/mysql
    networks:
      - local_network
    command: --max_allowed_packet=32505856
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root-password
      MARIADB_DATABASE: dev-database
      MARIADB_USER: dev-user
      MARIADB_PASSWORD: dev-password

  # Redis 7.2.4
  redis-7-2:
    image: redis:7.2.4-alpine
    container_name: redis-7-2
    ports:
      - "16379:6379"
    volumes:
      - redis-7-2:/data
    networks:
      - local_network
    restart: always

  # ValKey 8.1.3
  valkey-8-1:
    image: valkey/valkey:8.1.3-alpine
    container_name: valkey-8-1
    ports:
      - "26379:6379"
    volumes:
      - valkey-8-1:/data
    networks:
      - local_network
    restart: always

  # PHP 8.2.21-fpm
  php-fpm-cf:
    build:
      context: .
      dockerfile: Dockerfile.php-fpm-cf
    container_name: php-fpm-cf
    ports:
      - "10000:9000"
    networks:
      - local_network
    restart: always

  # S3Mock
  s3mock-3:
    image: adobe/s3mock:3.11.0
    container_name: s3mock-3
    ports:
      - "9092:9090"
    volumes:
      - s3mock:/data
    networks:
      - local_network
    restart: always
    environment:
      - initialBuckets=test-bucket

  # min.io RELEASE.2024-06-29T01-20-47Z
  minio:
    image: minio/minio:RELEASE.2024-06-29T01-20-47Z
    container_name: minio
    ports:
      - "9004:9000"
      - "9005:9001"
    volumes:
      - minio:/data
    networks:
      - local_network
    restart: always
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: dev-password
    command: server /data --console-address ":9001"

  createbuckets:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set minio http://minio:9000 minio dev-password;
      /usr/bin/mc mb minio/testS3bucket;
      /usr/bin/mc policy set public minio/testS3bucket;
      exit 0;
      "

  # MongoDB 7.0.12
  mongo-7-0:
    image: mongo:7.0.12
    container_name: mongo-7-0
    ports:
      - "27017:27017"
    volumes:
      - mongo-7-0:/data
    networks:
      - local_network
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root-dev-password

volumes:
  mariadb-10-11:
    name: mariadb-10-11
  mariadb-10-6:
    name: mariadb-10-6
  mariadb-10-9:
    name: mariadb-10-9
  redis-7-2:
    name: redis-7-2
  valkey-8-1:
    name: valkey-8-1
  s3mock:
    name: s3mock
  minio:
    name: minio
  mongo-7-0:
    name: mongo-7-0
  mock-saml:
    name: mock-saml

networks:
  local_network:
    name: local_network
#    external: true
